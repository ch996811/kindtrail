# Render's free plan puts the demo to sleep after 15 idle minutes, and waking it takes about a minute.
# While the hackathon is being judged, ping it so judges don't wait. Stops by itself after judging ends.
name: Keep the demo awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the hosted demo
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261216 ]; then echo "Judging is over"; exit 0; fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://kindtrail.onrender.com/api/health
