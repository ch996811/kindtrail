# Render Blueprint: one free Docker web service (https://render.com/docs/blueprint-spec).
# Free instances sleep after 15 idle minutes and their disk resets, so every wake-up starts a fresh demo.
services:
  - type: web
    name: kindtrail
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PAYPAL_ENV
        value: sandbox
      - key: DEMO_MODE
        value: "1"
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_DAILY_CAP
        value: "200"
      # Secrets: Render asks for these when the Blueprint is created. Never commit them.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SANDBOX_PERSONAL_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
